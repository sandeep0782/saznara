<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Page Not Found</title>

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .error-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .error-box {
            max-width: 500px;
            padding: 40px 20px;
        }

        .error-code {
            font-size: 90px;
            font-weight: 700;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-text {
            color: #6c757d;
            margin-bottom: 25px;
        }

        .home-btn {
            display: inline-block;
            padding: 10px 22px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .home-btn:hover {
            background: #0b5ed7;
            color: white;
        }
    </style>
</head>

<body>

<div class="error-page">
    <div class="error-box">

        <div class="error-code">404</div>

        <div class="error-title">
            Page Not Found
        </div>

        <p class="error-text">
            Sorry, the page you are looking for does not exist
            or may have been moved.
        </p>

        <a href="/" class="home-btn">
            <i class="fas fa-home me-1"></i>
            Return to Dashboard
        </a>

    </div>
</div>

</body>
</html>
